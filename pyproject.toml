[project]
name = "align"
version = "1.0.0"
description = "Global alignment of two DNA sequences: naive enumeration, dynamic programming, and Hirschberg's linear-space method"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
align = "align.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
bench = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/align"]

[tool.pytest.ini_options]
testpaths = ["tests"]
